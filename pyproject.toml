[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dftool"
version = "0.1.0"
description = "Data Function Tool - A collection of utility functions for daily data processing"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@company.com"},
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "demjson3>=1.0.0",
    "pyvis>=0.3.0",
    "networkx>=2.6.0",
    "rdflib>=6.0.0",
    "jsonlines>=3.0.0",
    "pyyaml>=6.0",
]
keywords = ["utils", "data-processing", "dataframe", "json", "pandas", "tools"]

[project.urls]
Homepage = "https://github.com/yourusername/dftool"
Repository = "https://github.com/yourusername/dftool.git"
Issues = "https://github.com/yourusername/dftool/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
    "ipython>=8.0.0",
    "ipdb>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dftool*"]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=dftool --cov-report=html"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.coverage.run]
source = ["dftool"]
omit = ["*/tests/*", "*/version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]